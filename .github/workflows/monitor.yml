name: Maguro Mart availability monitor

on:
  schedule:
    - cron: "*/20 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maguro-mart-monitor
  cancel-in-progress: true

jobs:
  check:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TARGET_DATE: "2026-09-19"
      PARTY_SIZE: "4"
      OUTPUT_FILE: "availability.json"

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      GH_TOKEN: ${{ github.token }}

    steps:

      # ==============================================
      # 1. Checkout
      # ==============================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ==============================================
      # 2. Python
      # ==============================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      # ==============================================
      # 3. Install dependencies
      # ==============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium


      # ==============================================
      # 4. Check TableCheck
      # ==============================================

      - name: Check Maguro Mart availability
        run: |
          python monitor.py


      # ==============================================
      # 5. Read result
      # ==============================================

      - name: Read availability result
        id: result
        shell: bash
        run: |

          echo "========== RESULT =========="
          cat availability.json
          echo "============================"

          AVAILABLE=$(jq -r '.available' availability.json)
          STATUS=$(jq -r '.status' availability.json)
          TIMES=$(jq -r '.times | join(", ")' availability.json)

          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "times=$TIMES" >> "$GITHUB_OUTPUT"


      # ==============================================
      # 6. Check INITIAL notification state
      # ==============================================

      - name: Check initial notification
        id: initial
        shell: bash
        run: |

          TITLE="[MONITOR STARTED] Maguro Mart 2026-09-19"

          COUNT=$(gh issue list \
            --state all \
            --search "\"$TITLE\" in:title" \
            --json title \
            --jq "[.[] | select(.title == \"$TITLE\")] | length")

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"


      # ==============================================
      # 7. Send INITIAL Telegram message
      # ==============================================

      - name: Send initial Telegram message
        if: steps.initial.outputs.count == '0'
        shell: bash
        run: |

          AVAILABLE="${{ steps.result.outputs.available }}"
          TIMES="${{ steps.result.outputs.times }}"

          if [ "$AVAILABLE" = "true" ]; then

            MESSAGE="🟢 Maguro Mart monitor started

          Date: 2026-09-19
          Party: 4 people

          Reservation AVAILABLE

          Times: $TIMES"

          else

            MESSAGE="🔴 Maguro Mart monitor started

          Date: 2026-09-19
          Party: 4 people

          Currently NO reservation available.

          Monitoring every 30 minutes."

          fi

          curl -s \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$MESSAGE"


      # ==============================================
      # 8. Mark initial notification completed
      # ==============================================

      - name: Mark monitor initialized
        if: steps.initial.outputs.count == '0'
        shell: bash
        run: |

          gh issue create \
            --title "[MONITOR STARTED] Maguro Mart 2026-09-19" \
            --body "Initial reservation check completed.

          Date: 2026-09-19
          Party size: 4

          The monitor will continue checking every 30 minutes."


      # ==============================================
      # 9. Check previous AVAILABLE alert
      # ==============================================

      - name: Check existing availability alert
        if: steps.result.outputs.available == 'true'
        id: existing
        shell: bash
        run: |

          TITLE="[AVAILABLE] Maguro Mart 2026-09-19 / 4 people"

          COUNT=$(gh issue list \
            --state open \
            --search "\"$TITLE\" in:title" \
            --json title \
            --jq "[.[] | select(.title == \"$TITLE\")] | length")

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"


      # ==============================================
      # 10. Send AVAILABLE notification
      # ==============================================

      - name: Send availability alert
        if: >
          steps.result.outputs.available == 'true' &&
          steps.existing.outputs.count == '0' &&
          steps.initial.outputs.count != '0'
        run: |

          python notify.py


      # ==============================================
      # 11. Create AVAILABLE state
      # ==============================================

      - name: Create availability state
        if: >
          steps.result.outputs.available == 'true' &&
          steps.existing.outputs.count == '0'
        shell: bash
        run: |

          TIMES="${{ steps.result.outputs.times }}"

          gh issue create \
            --title "[AVAILABLE] Maguro Mart 2026-09-19 / 4 people" \
            --body "Reservation available.

          Date: 2026-09-19
          Party size: 4

          Available times:

          ${TIMES}"


      # ==============================================
      # 12. Reset AVAILABLE state when sold out
      # ==============================================

      - name: Reset availability state
        if: steps.result.outputs.available == 'false'
        shell: bash
        run: |

          TITLE="[AVAILABLE] Maguro Mart 2026-09-19 / 4 people"

          gh issue list \
            --state open \
            --search "\"$TITLE\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" |
          while read -r N
          do

            if [ -n "$N" ]; then

              gh issue close "$N" \
                --comment "Reservation availability disappeared.

          Monitoring continues."

            fi

          done


      # ==============================================
      # 13. Upload debug files on error
      # ==============================================

      - name: Upload debug information
        if: steps.result.outputs.status == 'error'
        uses: actions/upload-artifact@v6
        with:

          name: tablecheck-debug

          path: |
            availability.json
            debug/

          retention-days: 3
