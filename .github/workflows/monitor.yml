name: Maguro Mart availability monitor

on:
  schedule:
    # 매시간 00분, 20분, 40분에 실행
    - cron: "7,27,47 * * * *"

  # 수동 실행
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maguro-mart-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TARGET_DATE: "2026-09-19"
      PARTY_SIZE: "4"
      OUTPUT_FILE: "availability.json"

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      # ==============================================
      # 1. Checkout
      # ==============================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ==============================================
      # 2. Python
      # ==============================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"


      # ==============================================
      # 3. Install dependencies
      # ==============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium


      # ==============================================
      # 4. Check TableCheck
      # ==============================================

      - name: Check Maguro Mart availability
        run: |
          python monitor.py


      # ==============================================
      # 5. Read result
      # ==============================================

      - name: Read availability result
        id: result
        shell: bash
        run: |
          echo "========== RESULT =========="
          cat availability.json
          echo "============================"

          AVAILABLE=$(jq -r '.available' availability.json)
          STATUS=$(jq -r '.status' availability.json)
          TIMES=$(jq -r '.times | join(", ")' availability.json)

          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "times=$TIMES" >> "$GITHUB_OUTPUT"


      # ==============================================
      # 6. Telegram - EVERY CHECK
      # ==============================================

      - name: Send Telegram result
        shell: bash
        run: |
          AVAILABLE="${{ steps.result.outputs.available }}"
          STATUS="${{ steps.result.outputs.status }}"
          TIMES="${{ steps.result.outputs.times }}"

          CHECKED_AT=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')

          if [ "$STATUS" = "error" ]; then

            MESSAGE="⚠️ Maguro Mart 예약 확인 오류

          확인시간: $CHECKED_AT
          날짜: 2026-09-19
          인원: 4명

          예약 페이지 확인 중 오류가 발생했습니다."

          elif [ "$AVAILABLE" = "true" ]; then

            MESSAGE="🚨 Maguro Mart 예약 가능

          확인시간: $CHECKED_AT
          날짜: 2026-09-19
          인원: 4명

          예약 가능한 시간이 발견되었습니다.

          가능한 시간: $TIMES

          https://www.tablecheck.com/ja/shops/maguro-mart/reserve"

          else

            MESSAGE="❌ Maguro Mart 예약 없음

          확인시간: $CHECKED_AT
          날짜: 2026-09-19
          인원: 4명

          현재 예약 가능한 시간이 없습니다.

          다음 확인: 약 20분 후"

          fi

          curl --fail --silent --show-error \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$MESSAGE"


      # ==============================================
      # 7. Debug files if error
      # ==============================================

      - name: Upload debug information
        if: steps.result.outputs.status == 'error'
        uses: actions/upload-artifact@v6
        with:
          name: tablecheck-debug
          path: |
            availability.json
            debug/
          retention-days: 3
