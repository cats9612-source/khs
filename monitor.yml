name: Maguro Mart availability monitor

on:
  schedule:
    # GitHub cron is UTC. Runs at minute 0 and 30 of every hour.
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maguro-mart-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_DATE: "2026-09-19"
      PARTY_SIZE: "4"
      OUTPUT_FILE: "availability.json"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check TableCheck
        run: python monitor.py

      - name: Show result
        run: cat availability.json

      - name: Read result
        id: result
        shell: bash
        run: |
          echo "available=$(jq -r '.available' availability.json)" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.status' availability.json)" >> "$GITHUB_OUTPUT"
          echo "times=$(jq -r '.times | join(", ")' availability.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether an availability alert is already open
        if: steps.result.outputs.available == 'true'
        id: existing
        shell: bash
        run: |
          TITLE="[AVAILABLE] Maguro Mart 2026-09-19 / 4 people"
          COUNT=$(gh issue list --state open --search "\"$TITLE\" in:title" --json title --jq "[.[] | select(.title == \"$TITLE\")] | length")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Send Telegram alert
        if: steps.result.outputs.available == 'true' && steps.existing.outputs.count == '0'
        run: python notify.py

      - name: Open state issue to prevent duplicate alerts
        if: steps.result.outputs.available == 'true' && steps.existing.outputs.count == '0'
        shell: bash
        run: |
          TITLE="[AVAILABLE] Maguro Mart 2026-09-19 / 4 people"
          TIMES="${{ steps.result.outputs.times }}"
          gh issue create \
            --title "$TITLE" \
            --body "Detected available TableCheck slot(s): **${TIMES}**. This issue is used as the monitor state and will be closed automatically when availability disappears."

      - name: Reset state when availability disappears
        if: steps.result.outputs.available == 'false'
        shell: bash
        run: |
          TITLE="[AVAILABLE] Maguro Mart 2026-09-19 / 4 people"
          gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq \
            ".[] | select(.title == \"$TITLE\") | .number" | \
          while read -r N; do
            [ -z "$N" ] || gh issue close "$N" --comment "No selectable slot detected on the latest check. State reset; a future reappearance will trigger a new Telegram alert."
          done

      - name: Upload diagnostics when detection errors
        if: steps.result.outputs.status == 'error'
        uses: actions/upload-artifact@v4
        with:
          name: tablecheck-debug
          path: |
            availability.json
            debug/
          retention-days: 3
